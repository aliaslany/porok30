name: Poll Telegram Sources

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # lets you trigger it manually too, for testing

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger bot command
        run: |
          curl -s \
          "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage" \
          -d chat_id=${{ secrets.ADMIN_CHAT_ID }} \
          --data-urlencode text="/pull_sources"
